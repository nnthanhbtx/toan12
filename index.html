    <meta property="og:title" content="Luyện tập Toán 12 - 2026-2027" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body ontouchstart="" class="bg-[#040817] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#040817;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;">' +
            '<div style="max-width:380px;background:#071126;border:1px solid #0284c7;border-radius:16px;padding:24px;">' +
            '<h2 style="margin:0 0 10px;font-size:18px;color:#fbbf24;">Đang tải lại ứng dụng Toán 12</h2>' +
            '<p style="margin:0 0 16px;font-size:13px;color:#bae6fd;line-height:1.5;">' +
            (e && e.message ? e.message : 'Trình duyệt cần làm mới bộ nhớ đệm để tương thích.') +
            '</p>' +
            '<button onclick="if(window.caches){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});});}setTimeout(function(){location.reload();},150);" style="width:100%;padding:12px;border:none;border-radius:12px;background:#06b6d4;color:#040817;font-weight:800;font-size:14px;">Tải Lại Ngay</button>' +
            '</div></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
